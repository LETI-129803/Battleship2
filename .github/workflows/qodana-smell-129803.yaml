
# 129803 - Iara Sofia de Oliveira

name: Qodana Long Parameter List - 129803

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129803.yaml
          use-annotations: true
          post-pr-comment: true
          upload-result: true
