# 129788
name: Qodana smell gate 129788
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2024.2
        with:
          args: --config,qodana-129788.yaml
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
