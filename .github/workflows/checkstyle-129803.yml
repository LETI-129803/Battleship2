
# 129803 - Iara Sofia de Oliveira
name: Checkstyle ConstantName - 129803

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkstyle:
    name: Checkstyle ConstantName
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Checkstyle - ConstantName
        run: >
          mvn -B -ntp
          org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check
          -Dcheckstyle.config.location=Checkstyle/checkstyle-129803.xml
          -Dcheckstyle.consoleOutput=true
          -Dcheckstyle.failOnViolation=true
