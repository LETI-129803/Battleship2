# 129788
name: Checkstyle gate 129788
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checkstyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkstyle
        uses: dbelyaev/action-checkstyle@v0.4.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-129788.xml
          level: error