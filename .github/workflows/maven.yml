# Workflow Java with Maven para Integracao Continua (CI) e execucao automatica de testes unitarios JUnit
name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build project with Maven
      run: mvn -B compile --file pom.xml

    - name: Run JUnit unit tests with Maven
      run: mvn -B test --file pom.xml
